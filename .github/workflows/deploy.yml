name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # federate into AWS
  pull-requests: write   # the sticky comment
  checks: write          # the check run

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::790543352839:role/tirith-action-demo-ci

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          # The wrapper copies every command's stdout into $GITHUB_OUTPUT, which a plan of any size
          # overflows. We only want the binary.
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -out=tfplan -input=false
      - run: terraform show -json tfplan > plan.json

      # Rules live in .tirith/policies/ and are evaluated here, on the runner. No account, no API
      # key, nothing leaves the machine -- and plan.json is found by convention, so the step needs
      # no inputs beyond the one that decides whether a failure blocks the deploy.
      - uses: StackGuardian/tirith-iac-governance-action@v2
        with:
          fail-on-error: true

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
