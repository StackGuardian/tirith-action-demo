name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # federate into AWS
  pull-requests: write   # the sticky comment
  checks: write          # the check run

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::790543352839:role/tirith-action-demo-ci

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          # The wrapper copies every command's stdout into $GITHUB_OUTPUT, which a plan of any size
          # overflows. We only want the binary.
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -out=tfplan -input=false
      - run: terraform show -json tfplan > plan.json

      # The same action, now evaluating the policies our organization enforces rather than files in
      # this repository. The credentials go on the step rather than in the job's env: block -- at job
      # scope every step could read them, terraform and third-party actions included.
      - uses: StackGuardian/tirith-iac-governance-action@v2.1.0
        with:
          sg-api-key: ${{ secrets.SG_API_TOKEN }}
          sg-org: ${{ vars.SG_ORG }}
          fail-on-error: true

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
