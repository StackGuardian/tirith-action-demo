name: deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write        # federate into AWS
  pull-requests: write   # the sticky comment
  checks: write          # the check run

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::790543352839:role/tirith-action-demo-ci

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4
          # The wrapper copies every command's stdout into $GITHUB_OUTPUT, which a plan of any size
          # overflows. We only want the binary.
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -out=tfplan -input=false
      - run: terraform show -json tfplan > plan.json

      # The same action, now evaluating the policies our organization enforces rather than files in
      # this repository. The credentials go on the step rather than in the job's env: block -- at job
      # scope every step could read them, terraform and third-party actions included.
      - uses: StackGuardian/tirith-iac-governance-action@v2
        with:
          sg-api-key: ${{ secrets.SG_API_TOKEN }}
          sg-org: ${{ vars.SG_ORG }}
          fail-on-error: true

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan

      # What is actually deployed, not what was proposed. On a pull request the apply above is
      # skipped, so this publishes the state as it currently stands; on a push to main it publishes
      # what was just applied. Masked in the runner before it leaves.
      - name: Read the current state
        run: terraform show -json > state.json

      # Publishing state is not a verdict, so this call gets neither reporting surface -- the gate
      # above owns the comment and the check run. continue-on-error because a publication step must
      # not be able to fail a deploy.
      - uses: StackGuardian/tirith-iac-governance-action@v2
        continue-on-error: true
        with:
          sg-api-key: ${{ secrets.SG_API_TOKEN }}
          sg-org: ${{ vars.SG_ORG }}
          input-path: state.json
          input-kind: terraform_state
          comment: false
          check: false
          # Still needed with both surfaces off: the tag also names the uploaded bundle, and the
          # default would overwrite the one the gate above just uploaded.
          comment-tag: post-apply
